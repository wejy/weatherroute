# Local Postgres (avoids host :5432 conflicts — use port 5433)
services:
  postgres:
    image: postgres:16-alpine
    container_name: solviax-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: solviax
      POSTGRES_PASSWORD: solviax
      POSTGRES_DB: solviax
    volumes:
      - solviax_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solviax -d solviax"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solviax_pgdata:
